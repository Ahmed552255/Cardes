<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash Sokoon | إدارة حجز الكتب</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --primary: #4F46E5;
      --primary-light: #818CF8;
      --action: #FB923C;
      --action-hover: #F97316;
      --accent: #EC4899;
      --success: #10B981;
      --warning: #F59E0B;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 12px rgba(0,0,0,0.04);
      --radius: 1.2rem;
      --transition: 0.2s ease;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.2rem;
      margin: 0;
    }

    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* الهيدر */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 0.9rem 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .logo {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .logo i {
      color: var(--action);
      font-size: 1.8rem;
    }

    /* أزرار عامة */
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.55rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.9rem;
      transition: all var(--transition);
      box-shadow: 0 2px 8px rgba(79,70,229,0.15);
      white-space: nowrap;
    }
    .btn:hover {
      background: #4338CA;
      transform: translateY(-1px);
    }
    .btn-action {
      background: var(--action);
      box-shadow: 0 2px 8px rgba(251,146,60,0.2);
    }
    .btn-action:hover {
      background: var(--action-hover);
    }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .btn-outline:hover {
      background: var(--border);
    }
    .btn-success {
      background: var(--success);
      box-shadow: 0 2px 8px rgba(16,185,129,0.2);
    }
    .btn-success:hover {
      background: #059669;
    }
    .btn-accent {
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(236,72,153,0.2);
    }
    .btn-accent:hover {
      background: #DB2777;
    }
    .btn-sm {
      padding: 0.3rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 1.5rem;
    }

    /* بطاقة البحث */
    .search-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 1.3rem 1.5rem;
    }
    .search-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1rem;
    }
    .search-form input, .search-form select {
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      font-size: 0.9rem;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }

    /* النتائج */
    .results-container {
      display: none;
    }
    .student-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .student-card-header {
      padding: 0.9rem 1.3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      border-bottom: 1px solid var(--border);
      background: #F8FAFF;
    }
    .student-info {
      display: flex;
      flex-direction: column;
    }
    .student-name {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .student-phone {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .mark-all-btn {
      background: var(--action);
      color: white;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all var(--transition);
    }
    .mark-all-btn:hover {
      background: var(--action-hover);
    }

    .books-list {
      display: flex;
      flex-direction: column;
    }
    .book-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1.3rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .book-row:last-child {
      border-bottom: none;
    }
    .book-details {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .doctor-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .book-title {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .price {
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
    }
    .book-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .status-badge {
      padding: 0.25rem 0.7rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-warning { background: #FEF3C7; color: #92400E; }
    .badge-success { background: #D1FAE5; color: #065F46; }
    .date-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .book-actions {
      display: flex;
      gap: 0.4rem;
    }

    .no-results {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    /* النافذة المنبثقة */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15,23,42,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: var(--surface);
      border-radius: 1.5rem;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      padding: 1.5rem;
      animation: modalPop 0.25s ease;
    }
    @keyframes modalPop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.3rem;
    }
    .modal-header h3 {
      font-size: 1.4rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: var(--accent);
    }

    .student-inputs {
      display: flex;
      gap: 0.7rem;
      margin-bottom: 1.3rem;
      flex-wrap: wrap;
    }
    .student-inputs input {
      flex: 1 1 180px;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .stepper-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      padding: 1.2rem;
      position: relative;
    }
    .step-dots {
      position: absolute;
      top: 0.9rem;
      right: 1rem;
      display: flex;
      gap: 0.4rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .dot.active {
      background: var(--primary);
      transform: scale(1.3);
    }
    .step-container {
      margin-top: 1.5rem;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .step select {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 0.4rem;
    }

    .added-books {
      background: rgba(79,70,229,0.02);
      border-radius: 0.9rem;
      padding: 0.8rem;
      margin-top: 0.8rem;
      border: 1px dashed var(--primary-light);
    }
    .added-books h4 {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .book-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .book-item:last-child { border-bottom: none; }
    .remove-book {
      color: var(--accent);
      cursor: pointer;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .remove-book:hover {
      transform: scale(1.2);
    }
    .total-price {
      text-align: left;
      font-weight: 800;
      font-size: 1.1rem;
      margin-top: 0.4rem;
      color: var(--primary);
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.3rem;
      justify-content: flex-end;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--success);
      color: white;
      padding: 0.7rem 1.8rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 2000;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 500px) {
      .header { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
      .modal { padding: 1rem; }
      .book-row { flex-direction: column; align-items: flex-start; }
      .book-meta { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">
        <i class="fas fa-moon"></i> Dash Sokoon
      </div>
      <button class="btn" onclick="openReservationModal()">
        <i class="fas fa-plus"></i> حجز جديد
      </button>
    </div>

    <!-- بطاقة البحث الجديدة -->
    <div class="search-card">
      <div class="search-form">
        <input type="text" id="searchName" placeholder="اسم الطالب">
        <input type="text" id="searchPhone" placeholder="رقم الهاتف (اختياري)">
        <input type="text" id="searchCollege" placeholder="الكلية">
        <input type="text" id="searchDept" placeholder="القسم">
        <select id="searchGrade">
          <option value="">كل الفرق</option>
          <option value="الأولى">الأولى</option>
          <option value="الثانية">الثانية</option>
          <option value="الثالثة">الثالثة</option>
          <option value="الرابعة">الرابعة</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="performSearch()" style="width:100%">
        <i class="fas fa-search"></i> بحث عن طالب
      </button>
    </div>

    <!-- حاوية النتائج -->
    <div id="resultsContainer" class="results-container"></div>
  </div>

  <!-- نافذة الحجز المنبثقة -->
  <div class="modal-overlay" id="reservationModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-book-medical"></i> حجز كتب جديدة</h3>
        <button class="close-btn" onclick="closeReservationModal()">
          <i class="fas fa-times-circle"></i>
        </button>
      </div>

      <div class="student-inputs">
        <input type="text" id="studentName" placeholder="👤 اسم الطالب رباعي">
        <input type="tel" id="studentPhone" placeholder="📱 رقم الهاتف">
      </div>

      <div class="stepper-card">
        <div class="step-dots" id="stepDots">
          <span class="dot active" data-step="0"></span>
          <span class="dot" data-step="1"></span>
          <span class="dot" data-step="2"></span>
          <span class="dot" data-step="3"></span>
        </div>
        <div class="step-container" id="stepContainer">
          <div class="step active" id="step0">
            <label><i class="fas fa-university"></i> اختر الكلية</label>
            <select id="collegeSelect" onchange="goToStep(1)"><option value="">-- اختر --</option></select>
          </div>
          <div class="step" id="step1">
            <label><i class="fas fa-layer-group"></i> القسم</label>
            <select id="deptSelect" onchange="goToStep(2)"><option value="">-- اختر --</option></select>
          </div>
          <div class="step" id="step2">
            <label><i class="fas fa-graduation-cap"></i> الفرقة الدراسية</label>
            <select id="gradeSelect" onchange="goToStep(3)">
              <option value="">-- اختر --</option>
              <option value="الأولى">الأولى</option>
              <option value="الثانية">الثانية</option>
              <option value="الثالثة">الثالثة</option>
              <option value="الرابعة">الرابعة</option>
            </select>
          </div>
          <div class="step" id="step3">
            <label><i class="fas fa-chalkboard-teacher"></i> الدكتور / المادة</label>
            <select id="doctorSelect"><option value="">-- اختر --</option></select>
            <button class="btn btn-action" onclick="addBookToCart()" id="addBookBtn" disabled style="margin-top: 0.5rem; width: 100%;">
              <i class="fas fa-cart-plus"></i> أضف الكتاب
            </button>
          </div>
        </div>
      </div>

      <div class="added-books" id="addedBooksContainer" style="display: none;">
        <h4><i class="fas fa-list-ul"></i> الكتب المختارة:</h4>
        <div id="booksList"></div>
        <div class="total-price">الإجمالي: <span id="totalPriceDisplay">0</span> ج</div>
        <button class="btn btn-outline" onclick="addAnotherBook()" style="margin-top: 0.5rem; width: 100%;">
          <i class="fas fa-plus"></i> أضف كتاب آخر
        </button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeReservationModal()">
          <i class="fas fa-times"></i> إلغاء
        </button>
        <button class="btn btn-action" onclick="finalizeReservation()" id="finalizeBtn" disabled>
          <i class="fas fa-check"></i> تم
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ---------- قراءة البيانات الديناميكية من لوحة الإدارة ----------
    const CONFIG_KEY = 'sokoon_config';
    const BOOKS_KEY = 'sokoon_books';
    const RESERVATIONS_KEY = 'dash_sokoon_v3';

    function loadConfig() {
      const stored = localStorage.getItem(CONFIG_KEY);
      return stored ? JSON.parse(stored) : { colleges: [], depts: [] };
    }

    function loadBooks() {
      const stored = localStorage.getItem(BOOKS_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    function loadReservations() {
      const stored = localStorage.getItem(RESERVATIONS_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    let reservations = loadReservations();
    let dynamicConfig = loadConfig();
    let booksDatabase = loadBooks(); // مصدر الكتب الوحيد

    // ---------- حالة النافذة ----------
    let currentStudent = { name: '', phone: '', college: '', dept: '', grade: '' };
    let currentBooks = [];
    let currentStep = 0;
    let studentLocked = false;

    // ---------- تهيئة ----------
    function init() {
      populateColleges();
      // إخفاء النتائج بشكل افتراضي
      document.getElementById('resultsContainer').style.display = 'none';
      // أحداث النقاط
      document.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', () => jumpToStep(parseInt(dot.dataset.step)));
      });
      document.getElementById('doctorSelect').addEventListener('change', function() {
        document.getElementById('addBookBtn').disabled = !this.value;
      });
    }

    function populateColleges() {
      const sel = document.getElementById('collegeSelect');
      sel.innerHTML = '<option value="">-- اختر --</option>';
      dynamicConfig.colleges.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
    }

    // ---------- إعادة ضبط الخطوات ----------
    function setActiveStep(step) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById(`step${step}`).classList.add('active');
      document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
      document.querySelector(`.dot[data-step="${step}"]`).classList.add('active');
      currentStep = step;
    }

    function goToStep(step) {
      if (step > currentStep) {
        if (currentStep === 0 && !document.getElementById('collegeSelect').value) return showToast('الرجاء اختيار الكلية', 'warning');
        if (currentStep === 1 && !document.getElementById('deptSelect').value) return showToast('الرجاء اختيار القسم', 'warning');
        if (currentStep === 2 && !document.getElementById('gradeSelect').value) return showToast('الرجاء اختيار الفرقة', 'warning');
      }
      if (currentStep === 0 && step > 0) updateDepartments();
      if (currentStep === 1 && step > 1) currentStudent.college = document.getElementById('collegeSelect').value;
      if (currentStep === 2 && step > 2) {
        currentStudent.dept = document.getElementById('deptSelect').value;
        currentStudent.grade = document.getElementById('gradeSelect').value;
        updateDoctors();
      }
      setActiveStep(step);
    }

    function jumpToStep(step) {
      if (studentLocked) return showToast('بيانات الطالب مثبتة', 'warning');
      if (step < currentStep) {
        if (step < 1) document.getElementById('deptSelect').innerHTML = '<option value="">-- اختر --</option>';
        if (step < 2) document.getElementById('gradeSelect').value = '';
        if (step < 3) document.getElementById('doctorSelect').innerHTML = '<option value="">-- اختر --</option>';
        setActiveStep(step);
      } else if (step > currentStep) {
        showToast('يجب إكمال الخطوات بالترتيب', 'warning');
      }
    }

    function updateDepartments() {
      const dept = document.getElementById('deptSelect');
      dept.innerHTML = '<option value="">-- اختر --</option>';
      const college = document.getElementById('collegeSelect').value;
      dynamicConfig.depts.forEach(d => dept.innerHTML += `<option value="${d}">${d}</option>`);
      // يمكن تحسينه لتصفية الأقسام حسب الكلية إن توفرت العلاقة في البيانات
      document.getElementById('gradeSelect').value = '';
    }

    function updateDoctors() {
      const doc = document.getElementById('doctorSelect');
      doc.innerHTML = '<option value="">-- اختر --</option>';
      const college = currentStudent.college || document.getElementById('collegeSelect').value;
      const dept = currentStudent.dept || document.getElementById('deptSelect').value;
      const grade = currentStudent.grade || document.getElementById('gradeSelect').value;
      // تصفية الكتب المناسبة من قاعدة الكتب
      const filteredBooks = booksDatabase.filter(b => 
        b.college === college && b.dept === dept && b.grade === grade
      );
      filteredBooks.forEach(b => {
        doc.innerHTML += `<option value="${b.id}">${b.doc} - ${b.title} (${b.price} ج)</option>`;
      });
      document.getElementById('addBookBtn').disabled = true;
    }

    // ---------- النافذة ----------
    function openReservationModal() {
      ['studentName','studentPhone','collegeSelect','gradeSelect'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('deptSelect').innerHTML = '<option value="">-- اختر --</option>';
      document.getElementById('doctorSelect').innerHTML = '<option value="">-- اختر --</option>';
      document.getElementById('addedBooksContainer').style.display = 'none';
      document.getElementById('booksList').innerHTML = '';
      document.getElementById('totalPriceDisplay').textContent = '0';
      document.getElementById('finalizeBtn').disabled = true;
      document.getElementById('addBookBtn').disabled = true;
      ['studentName','studentPhone','collegeSelect','deptSelect','gradeSelect'].forEach(id => document.getElementById(id).disabled = false);
      currentStudent = { name: '', phone: '', college: '', dept: '', grade: '' };
      currentBooks = [];
      studentLocked = false;
      setActiveStep(0);
      document.getElementById('reservationModal').classList.add('active');
    }

    function closeReservationModal() {
      document.getElementById('reservationModal').classList.remove('active');
    }

    function addBookToCart() {
      const name = document.getElementById('studentName').value.trim();
      const phone = document.getElementById('studentPhone').value.trim();
      const docId = parseInt(document.getElementById('doctorSelect').value);
      if (!name || !phone) return showToast('أدخل الاسم ورقم الهاتف', 'warning');
      if (!studentLocked) {
        const college = document.getElementById('collegeSelect').value;
        const dept = document.getElementById('deptSelect').value;
        const grade = document.getElementById('gradeSelect').value;
        if (!college || !dept || !grade) return showToast('أكمل جميع الخطوات', 'warning');
        currentStudent = { name, phone, college, dept, grade };
        studentLocked = true;
        ['studentName','studentPhone','collegeSelect','deptSelect','gradeSelect'].forEach(id => document.getElementById(id).disabled = true);
      }
      const book = booksDatabase.find(b => b.id === docId);
      if (!book) return;
      currentBooks.push({ bookId: book.id, doctorName: book.doc, book: book.title, price: book.price });
      updateBooksList();
      document.getElementById('doctorSelect').value = '';
      document.getElementById('addBookBtn').disabled = true;
      document.getElementById('addedBooksContainer').style.display = 'block';
    }

    function addAnotherBook() {
      document.getElementById('doctorSelect').value = '';
      document.getElementById('addBookBtn').disabled = true;
      document.getElementById('doctorSelect').focus();
    }

    function updateBooksList() {
      const list = document.getElementById('booksList');
      list.innerHTML = '';
      let total = 0;
      currentBooks.forEach((b, i) => {
        total += b.price;
        const div = document.createElement('div');
        div.className = 'book-item';
        div.innerHTML = `<span><i class="fas fa-book"></i> ${b.book} - ${b.doctorName} (${b.price} ج)</span>
                         <span class="remove-book" onclick="removeBook(${i})"><i class="fas fa-trash-alt"></i></span>`;
        list.appendChild(div);
      });
      document.getElementById('totalPriceDisplay').textContent = total;
      document.getElementById('finalizeBtn').disabled = currentBooks.length === 0;
    }

    function removeBook(index) {
      currentBooks.splice(index, 1);
      if (currentBooks.length === 0) {
        studentLocked = false;
        ['studentName','studentPhone','collegeSelect','deptSelect','gradeSelect'].forEach(id => document.getElementById(id).disabled = false);
        document.getElementById('addedBooksContainer').style.display = 'none';
      }
      updateBooksList();
    }

    function finalizeReservation() {
      if (!currentBooks.length) return;
      const ts = Date.now();
      const date = new Date().toLocaleDateString('ar-EG');
      currentBooks.forEach(b => {
        reservations.push({
          id: 'SB-' + Math.floor(1000 + Math.random() * 9000),
          studentName: currentStudent.name,
          phone: currentStudent.phone,
          college: currentStudent.college,
          department: currentStudent.dept,
          grade: currentStudent.grade,
          doctor: b.doctorName,
          book: b.book,
          price: b.price,
          received: false,
          timestamp: ts,
          date: date
        });
      });
      localStorage.setItem(RESERVATIONS_KEY, JSON.stringify(reservations));
      showToast(`تم حجز ${currentBooks.length} كتب`, 'success');
      closeReservationModal();
      // لا نعيد عرض النتائج تلقائياً
    }

    // ---------- عمليات التسليم والحذف ----------
    function markReceived(id) {
      const res = reservations.find(r => r.id === id);
      if (res && !res.received) {
        res.received = true;
        localStorage.setItem(RESERVATIONS_KEY, JSON.stringify(reservations));
        performSearch(); // إعادة تنفيذ آخر بحث لتحديث العرض
        showToast('تم التسليم', 'success');
      }
    }

    function markAllReceived(phone) {
      let updated = false;
      reservations = reservations.map(r => {
        if (r.phone === phone && !r.received) { updated = true; return { ...r, received: true }; }
        return r;
      });
      if (updated) {
        localStorage.setItem(RESERVATIONS_KEY, JSON.stringify(reservations));
        performSearch();
        showToast('تم تسليم جميع الكتب', 'success');
      } else {
        showToast('جميع الكتب مستلمة', 'warning');
      }
    }

    function deleteReservation(id) {
      if (confirm('حذف هذا الحجز؟')) {
        reservations = reservations.filter(r => r.id !== id);
        localStorage.setItem(RESERVATIONS_KEY, JSON.stringify(reservations));
        performSearch();
        showToast('تم الحذف', 'warning');
      }
    }

    // ---------- البحث الجديد ----------
    function performSearch() {
      const name = document.getElementById('searchName').value.trim().toLowerCase();
      const phone = document.getElementById('searchPhone').value.trim();
      const college = document.getElementById('searchCollege').value.trim().toLowerCase();
      const dept = document.getElementById('searchDept').value.trim().toLowerCase();
      const grade = document.getElementById('searchGrade').value;

      const container = document.getElementById('resultsContainer');
      
      // فلترة الحجوزات
      let filtered = reservations.filter(r => {
        const matchName = !name || r.studentName.toLowerCase().includes(name);
        const matchPhone = !phone || r.phone.includes(phone);
        const matchCollege = !college || r.college.toLowerCase().includes(college);
        const matchDept = !dept || (r.department || '').toLowerCase().includes(dept);
        const matchGrade = !grade || r.grade === grade;
        return matchName && matchPhone && matchCollege && matchDept && matchGrade;
      });

      if (filtered.length === 0) {
        container.style.display = 'block';
        container.innerHTML = '<div class="no-results"><i class="fas fa-inbox"></i> لا توجد نتائج</div>';
        return;
      }

      // تجميع حسب الطالب
      const grouped = {};
      filtered.forEach(r => {
        const key = r.phone;
        if (!grouped[key]) {
          grouped[key] = {
            phone: r.phone,
            name: r.studentName,
            books: []
          };
        }
        grouped[key].books.push(r);
      });

      let html = '';
      Object.values(grouped).forEach(g => {
        const hasUnreceived = g.books.some(b => !b.received);
        html += `<div class="student-card">
          <div class="student-card-header">
            <div class="student-info">
              <span class="student-name"><i class="fas fa-user-graduate"></i> ${g.name}</span>
              <span class="student-phone"><i class="fas fa-phone-alt"></i> ${g.phone}</span>
            </div>
            ${hasUnreceived ? `<button class="mark-all-btn" onclick="markAllReceived('${g.phone}')"><i class="fas fa-check-double"></i> تسليم الكل</button>` : ''}
          </div>
          <div class="books-list">
            ${g.books.map(b => `
              <div class="book-row">
                <div class="book-details">
                  <span class="doctor-name"><i class="fas fa-chalkboard-teacher"></i> ${b.doctor}</span>
                  <span class="book-title"><i class="fas fa-book"></i> ${b.book}</span>
                </div>
                <div class="book-meta">
                  <span class="price">${b.price} ج</span>
                  <span class="status-badge ${b.received ? 'badge-success' : 'badge-warning'}">
                    <i class="fas ${b.received ? 'fa-check-circle' : 'fa-clock'}"></i> ${b.received ? 'تم' : 'انتظار'}
                  </span>
                  <span class="date-text"><i class="fas fa-calendar-alt"></i> ${b.date}</span>
                </div>
                <div class="book-actions">
                  ${!b.received ? `<button class="btn btn-action btn-sm" onclick="markReceived('${b.id}')"><i class="fas fa-check"></i> تسليم</button>` : ''}
                  <button class="btn btn-accent btn-sm" onclick="deleteReservation('${b.id}')"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>`;
      });

      container.style.display = 'block';
      container.innerHTML = html;
    }

    // ---------- توست ----------
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<i class="fas fa-${type === 'warning' ? 'exclamation-triangle' : 'check-circle'}"></i> ${msg}`;
      toast.style.background = type === 'warning' ? '#F59E0B' : '#10B981';
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    init();
  </script>
</body>
</html>
