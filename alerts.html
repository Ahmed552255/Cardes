<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash Sokoon | الإدارة الذكية</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --action: #FB923C;
      --action-dark: #EA580C;
      --bg: #F1F5F9;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
      --danger-hover: #DC2626;
      --success: #10B981;
      --radius-xl: 1.5rem;
      --radius-lg: 1rem;
      --radius-md: 0.75rem;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79,70,229,0.03) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(251,146,60,0.03) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: clamp(0.75rem, 2vw, 1.5rem);
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: clamp(1rem, 3vw, 1.5rem) clamp(1rem, 3vw, 1.5rem);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: clamp(1rem, 2vw, 1.5rem);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .header h1 {
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--action));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .header h1 span {
      color: var(--action);
    }

    .date-badge {
      background: var(--bg);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.4rem;
      background: var(--surface);
      padding: 0.4rem;
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab {
      flex: 1;
      min-width: fit-content;
      padding: 0.75rem 1.2rem;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      white-space: nowrap;
      user-select: none;
    }

    .tab.active {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow);
    }

    .tab:not(.active):hover {
      background: #F1F5F9;
    }

    .tab-content {
      display: none;
      animation: fadeSlide 0.35s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: clamp(1rem, 3vw, 1.5rem);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
    }

    /* Buttons */
    .btn {
      padding: 0.65rem 1.4rem;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
      white-space: nowrap;
      user-select: none;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 4px 12px rgba(79,70,229,0.4);
    }

    .btn-action {
      background: var(--action);
      color: white;
      box-shadow: 0 2px 8px rgba(251,146,60,0.3);
    }

    .btn-action:hover {
      background: var(--action-dark);
      box-shadow: 0 4px 12px rgba(251,146,60,0.4);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: #F8FAFC;
      border-color: #CBD5E1;
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.4rem;
      border-radius: 0.4rem;
      transition: var(--transition);
      color: var(--text-secondary);
    }

    .btn-icon.edit:hover {
      color: var(--primary);
      background: rgba(79,70,229,0.08);
    }

    .btn-icon.delete:hover {
      color: var(--danger);
      background: rgba(239,68,68,0.08);
    }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -0.5rem;
      padding: 0 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
    }

    th {
      text-align: right;
      padding: 0.8rem 0.6rem;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 0.8rem 0.6rem;
      border-bottom: 1px solid #F1F5F9;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #F8FAFC;
    }

    .price {
      font-weight: 800;
      color: var(--primary);
      direction: ltr;
      text-align: right;
    }

    .actions {
      display: flex;
      gap: 0.3rem;
      justify-content: flex-end;
    }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-secondary);
    }

    .empty i {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
      opacity: 0.4;
    }

    .empty p {
      font-weight: 600;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: clamp(1.2rem, 3vw, 1.8rem);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      transform: translateY(20px);
      transition: var(--transition);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal h3 {
      font-size: 1.1rem;
      margin-bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group input[list] {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      transition: var(--transition);
      background: var(--bg);
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
      background: white;
    }

    .modal-footer {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1E293B;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 2000;
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: var(--danger);
    }

    /* Loader */
    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .btn {
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
      }

      .card-header {
        flex-direction: column;
        align-items: stretch;
      }

      .card-header .btn {
        justify-content: center;
      }

      th, td {
        padding: 0.6rem 0.4rem;
      }

      .modal {
        margin: 0.5rem;
        border-radius: var(--radius-lg);
      }
    }

    @media (max-width: 380px) {
      .tab {
        padding: 0.6rem 0.8rem;
        font-size: 0.8rem;
        gap: 0.3rem;
      }

      table {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>DASH <span>SOKOON</span></h1>
    <div class="date-badge">
      <i class="far fa-calendar-alt"></i>
      <span id="dateDisplay"></span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="staff-tab">
      <i class="fas fa-user-shield"></i> الموظفين
    </button>
    <button class="tab" data-tab="books-tab">
      <i class="fas fa-book"></i> الكتب
    </button>
  </div>

  <!-- Staff Tab -->
  <div id="staff-tab" class="tab-content active">
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-users"></i> إدارة الموظفين</div>
        <button class="btn btn-action" onclick="openModal('staff')">
          <i class="fas fa-plus"></i> إضافة موظف
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>اسم المستخدم</th>
              <th>كلمة المرور</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="staffTableBody">
            <tr class="empty"><td colspan="4"><i class="fas fa-inbox"></i><p>جاري التحميل...</p></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Books Tab -->
  <div id="books-tab" class="tab-content">
    <div class="card">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-book-open"></i> إدارة الكتب</div>
        <button class="btn btn-action" onclick="openModal('book')">
          <i class="fas fa-plus"></i> إضافة كتاب
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>الدكتور</th>
              <th>المادة</th>
              <th>الكلية/القسم</th>
              <th>السعر</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            <tr class="empty"><td colspan="5"><i class="fas fa-inbox"></i><p>جاري التحميل...</p></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Staff Modal -->
<div class="modal-overlay" id="staffModal">
  <div class="modal">
    <h3 id="staffModalTitle"><i class="fas fa-user-plus"></i> إضافة موظف</h3>
    <input type="hidden" id="staffId">
    <div class="form-group">
      <label>الاسم الكامل</label>
      <input type="text" id="staffName" placeholder="أدخل الاسم الثلاثي">
    </div>
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="staffUser" placeholder="اسم الدخول للنظام">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="staffPass" placeholder="••••••••">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('staff')">إلغاء</button>
      <button class="btn btn-primary" id="staffSaveBtn" onclick="saveStaff()">
        <i class="fas fa-save"></i> حفظ
      </button>
    </div>
  </div>
</div>

<!-- Book Modal -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <h3 id="bookModalTitle"><i class="fas fa-plus-circle"></i> إضافة كتاب</h3>
    <input type="hidden" id="bookId">
    <div class="form-group">
      <label>اسم الدكتور</label>
      <input type="text" id="docName" placeholder="د. أحمد فوزي">
    </div>
    <div class="form-group">
      <label>المادة</label>
      <input type="text" id="bookTitle" placeholder="اسم المادة الدراسية">
    </div>
    <div class="form-group">
      <label>الكلية</label>
      <input list="collegesList" id="collegeInput" placeholder="اختر أو اكتب اسم الكلية">
      <datalist id="collegesList"></datalist>
    </div>
    <div class="form-group">
      <label>القسم</label>
      <input list="deptsList" id="deptInput" placeholder="اختر أو اكتب اسم القسم">
      <datalist id="deptsList"></datalist>
    </div>
    <div class="form-group">
      <label>السعر (ج.م)</label>
      <input type="number" id="bookPrice" placeholder="0.00" step="0.01" min="0">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('book')">إلغاء</button>
      <button class="btn btn-primary" id="bookSaveBtn" onclick="saveBook()">
        <i class="fas fa-save"></i> حفظ
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, push, update, remove, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ========== إعداد Firebase ==========
  const firebaseConfig = {
    apiKey: "AIzaSyB1iGYl3_VuVAOyVexQsg3rKTDt0OZMRSk",
    authDomain: "dagd-9b228.firebaseapp.com",
    databaseURL: "https://dagd-9b228-default-rtdb.firebaseio.com",
    projectId: "dagd-9b228",
    storageBucket: "dagd-9b228.firebasestorage.app",
    messagingSenderId: "299664084614",
    appId: "1:299664084614:web:39df93bcbde273c4d84307",
    measurementId: "G-52C4B7Q2YQ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ========== المتغيرات العامة ==========
  let staffData = [];
  let booksData = [];
  let dynamicLists = { colleges: [], depts: [] };

  // ========== عناصر DOM ==========
  const staffTableBody = document.getElementById('staffTableBody');
  const booksTableBody = document.getElementById('booksTableBody');
  const toast = document.getElementById('toast');
  let toastTimer;

  // ========== دوال مساعدة ==========
  function showToast(msg, isError = false) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = 'toast' + (isError ? ' error' : '');
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function showLoading(tableBody, colspan) {
    tableBody.innerHTML = `<tr class="empty"><td colspan="${colspan}"><div class="spinner" style="border-color: rgba(79,70,229,0.3); border-top-color: #4F46E5; width: 1.5rem; height: 1.5rem;"></div><p>جاري التحميل...</p></td></tr>`;
  }

  function showEmpty(tableBody, colspan, icon, msg) {
    tableBody.innerHTML = `<tr class="empty"><td colspan="${colspan}"><i class="fas ${icon}"></i><p>${msg}</p></td></tr>`;
  }

  // ========== التاريخ ==========
  function updateDate() {
    const d = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('dateDisplay').textContent = d.toLocaleDateString('ar-EG', options);
  }
  updateDate();

  // ========== التبويبات ==========
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      this.classList.add('active');
      document.getElementById(this.dataset.tab).classList.add('active');
    });
  });

  // ========== المودال ==========
  function openModal(type, id = null) {
    const modal = document.getElementById(type + 'Modal');
    const title = document.getElementById(type + 'ModalTitle');
    
    if (type === 'staff') {
      document.getElementById('staffId').value = '';
      document.getElementById('staffName').value = '';
      document.getElementById('staffUser').value = '';
      document.getElementById('staffPass').value = '';
      title.innerHTML = '<i class="fas fa-user-plus"></i> إضافة موظف';
      
      if (id) {
        const item = staffData.find(s => s.id === id);
        if (item) {
          document.getElementById('staffId').value = item.id;
          document.getElementById('staffName').value = item.name;
          document.getElementById('staffUser').value = item.username;
          document.getElementById('staffPass').value = item.password;
          title.innerHTML = '<i class="fas fa-user-edit"></i> تعديل موظف';
        }
      }
    } else {
      document.getElementById('bookId').value = '';
      document.getElementById('docName').value = '';
      document.getElementById('bookTitle').value = '';
      document.getElementById('collegeInput').value = '';
      document.getElementById('deptInput').value = '';
      document.getElementById('bookPrice').value = '';
      title.innerHTML = '<i class="fas fa-plus-circle"></i> إضافة كتاب';
      updateDatalists();
      
      if (id) {
        const item = booksData.find(b => b.id === id);
        if (item) {
          document.getElementById('bookId').value = item.id;
          document.getElementById('docName').value = item.doc;
          document.getElementById('bookTitle').value = item.title;
          document.getElementById('collegeInput').value = item.college;
          document.getElementById('deptInput').value = item.dept || '';
          document.getElementById('bookPrice').value = item.price;
          title.innerHTML = '<i class="fas fa-edit"></i> تعديل كتاب';
        }
      }
    }
    
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(type) {
    document.getElementById(type + 'Modal').classList.remove('active');
    document.body.style.overflow = '';
  }

  // إغلاق المودال بالنقر خارجه
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
      if (e.target === this) {
        this.classList.remove('active');
        document.body.style.overflow = '';
      }
    });
  });

  // ========== Firebase: الموظفين ==========
  const staffRef = ref(db, 'staff');

  function loadStaff() {
    showLoading(staffTableBody, 4);
    
    onValue(staffRef, (snapshot) => {
      staffData = [];
      if (snapshot.exists()) {
        const data = snapshot.val();
        staffData = Object.keys(data).map(key => ({
          id: key,
          ...data[key]
        }));
        renderStaff();
      } else {
        showEmpty(staffTableBody, 4, 'fa-user-slash', 'لا يوجد موظفين حتى الآن');
      }
    }, (error) => {
      showToast('فشل تحميل بيانات الموظفين', true);
      showEmpty(staffTableBody, 4, 'fa-exclamation-circle', 'خطأ في التحميل');
    });
  }

  function renderStaff() {
    if (staffData.length === 0) {
      showEmpty(staffTableBody, 4, 'fa-user-slash', 'لا يوجد موظفين حتى الآن');
      return;
    }
    
    staffTableBody.innerHTML = staffData.map(s => `
      <tr>
        <td>${escapeHtml(s.name)}</td>
        <td>${escapeHtml(s.username)}</td>
        <td>••••••</td>
        <td>
          <div class="actions">
            <button class="btn-icon edit" onclick="window.editStaff('${s.id}')" title="تعديل">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn-icon delete" onclick="window.deleteStaff('${s.id}')" title="حذف">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function saveStaff() {
    const id = document.getElementById('staffId').value;
    const name = document.getElementById('staffName').value.trim();
    const username = document.getElementById('staffUser').value.trim();
    const password = document.getElementById('staffPass').value.trim();
    
    if (!name || !username || !password) {
      showToast('الرجاء ملء جميع الحقول', true);
      return;
    }

    const btn = document.getElementById('staffSaveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';

    const staffObj = { name, username, password };

    try {
      if (id) {
        await update(ref(db, `staff/${id}`), staffObj);
        showToast('تم تعديل الموظف بنجاح ✅');
      } else {
        await push(staffRef, staffObj);
        showToast('تم إضافة الموظف بنجاح ✅');
      }
      closeModal('staff');
    } catch (error) {
      showToast('حدث خطأ أثناء الحفظ', true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
    }
  }

  window.editStaff = function(id) {
    openModal('staff', id);
  };

  window.deleteStaff = async function(id) {
    if (!confirm('هل أنت متأكد من حذف هذا الموظف؟')) return;
    
    try {
      await remove(ref(db, `staff/${id}`));
      showToast('تم حذف الموظف بنجاح 🗑️');
    } catch (error) {
      showToast('فشل حذف الموظف', true);
    }
  };

  // ========== Firebase: الكتب ==========
  const booksRef = ref(db, 'books');

  function loadBooks() {
    showLoading(booksTableBody, 5);
    
    onValue(booksRef, (snapshot) => {
      booksData = [];
      dynamicLists = { colleges: [], depts: [] };
      
      if (snapshot.exists()) {
        const data = snapshot.val();
        booksData = Object.keys(data).map(key => ({
          id: key,
          ...data[key]
        }));
        
        // جمع الكليات والأقسام
        booksData.forEach(b => {
          if (b.college && !dynamicLists.colleges.includes(b.college)) {
            dynamicLists.colleges.push(b.college);
          }
          if (b.dept && !dynamicLists.depts.includes(b.dept)) {
            dynamicLists.depts.push(b.dept);
          }
        });
        
        renderBooks();
      } else {
        showEmpty(booksTableBody, 5, 'fa-book-open', 'لا يوجد كتب حتى الآن');
      }
      updateDatalists();
    }, (error) => {
      showToast('فشل تحميل بيانات الكتب', true);
      showEmpty(booksTableBody, 5, 'fa-exclamation-circle', 'خطأ في التحميل');
    });
  }

  function renderBooks() {
    if (booksData.length === 0) {
      showEmpty(booksTableBody, 5, 'fa-book-open', 'لا يوجد كتب حتى الآن');
      return;
    }
    
    booksTableBody.innerHTML = booksData.map(b => `
      <tr>
        <td>${escapeHtml(b.doc)}</td>
        <td>${escapeHtml(b.title)}</td>
        <td>${escapeHtml(b.college)}${b.dept ? ' - ' + escapeHtml(b.dept) : ''}</td>
        <td class="price">${Number(b.price).toFixed(2)} ج</td>
        <td>
          <div class="actions">
            <button class="btn-icon edit" onclick="window.editBook('${b.id}')" title="تعديل">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn-icon delete" onclick="window.deleteBook('${b.id}')" title="حذف">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  function updateDatalists() {
    document.getElementById('collegesList').innerHTML = dynamicLists.colleges.map(c => `<option value="${escapeHtml(c)}">`).join('');
    document.getElementById('deptsList').innerHTML = dynamicLists.depts.map(d => `<option value="${escapeHtml(d)}">`).join('');
  }

  async function saveBook() {
    const id = document.getElementById('bookId').value;
    const doc = document.getElementById('docName').value.trim();
    const title = document.getElementById('bookTitle').value.trim();
    const college = document.getElementById('collegeInput').value.trim();
    const dept = document.getElementById('deptInput').value.trim();
    const price = document.getElementById('bookPrice').value.trim();
    
    if (!doc || !title || !college || !price) {
      showToast('الرجاء ملء جميع الحقول المطلوبة', true);
      return;
    }

    if (isNaN(price) || Number(price) < 0) {
      showToast('السعر غير صحيح', true);
      return;
    }

    const btn = document.getElementById('bookSaveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';

    const bookObj = {
      doc,
      title,
      college,
      dept: dept || '',
      price: Number(price)
    };

    try {
      if (id) {
        await update(ref(db, `books/${id}`), bookObj);
        showToast('تم تعديل الكتاب بنجاح ✅');
      } else {
        await push(booksRef, bookObj);
        showToast('تم إضافة الكتاب بنجاح ✅');
      }
      closeModal('book');
    } catch (error) {
      showToast('حدث خطأ أثناء الحفظ', true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-save"></i> حفظ';
    }
  }

  window.editBook = function(id) {
    openModal('book', id);
  };

  window.deleteBook = async function(id) {
    if (!confirm('هل أنت متأكد من حذف هذا الكتاب؟')) return;
    
    try {
      await remove(ref(db, `books/${id}`));
      showToast('تم حذف الكتاب بنجاح 🗑️');
    } catch (error) {
      showToast('فشل حذف الكتاب', true);
    }
  };

  // ========== حماية XSS ==========
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ========== بدء التشغيل ==========
  loadStaff();
  loadBooks();

  // تعريض الدوال للاستخدام العام
  window.openModal = openModal;
  window.closeModal = closeModal;
  window.saveStaff = saveStaff;
  window.saveBook = saveBook;
</script>

</body>
    </html>
