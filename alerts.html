<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash Sokoon Admin | إدارة الكتب والطلاب</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4F46E5;
      --action: #FB923C;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --radius-lg: 1.2rem;
      --radius-md: 0.8rem;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 1rem; }

    .admin-wrapper { max-width: 1100px; margin: 0 auto; }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }
    .admin-header h1 { font-size: 1.8rem; font-weight: 800; color: var(--primary); }
    .admin-header h1 span { color: var(--action); }
    .header-btns { display: flex; gap: 0.6rem; align-items: center; }

    .btn {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s;
      font-size: 0.95rem;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #4338CA; transform: translateY(-2px); }
    .btn-action { background: var(--action); color: white; }
    .btn-action:hover { background: #EA580C; transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--border); }
    .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.85rem; }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .card-title { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 0.6rem; color: var(--primary); }

    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: right; padding: 1rem; color: var(--text-secondary); border-bottom: 2px solid var(--border); font-size: 0.9rem; }
    td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .price-tag { font-weight: 800; color: var(--primary); }
    .actions { display: flex; gap: 0.5rem; }
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0.3rem; border-radius: 0.3rem; transition: 0.2s; }
    .btn-icon.edit { color: var(--primary); }
    .btn-icon.edit:hover { background: rgba(79,70,229,0.1); }
    .btn-icon.delete { color: #EF4444; }
    .btn-icon.delete:hover { background: rgba(239,68,68,0.1); }

    .status-badge {
      padding: 0.3rem 0.7rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-announced { background: #DBEAFE; color: #1E40AF; }
    .status-published { background: #D1FAE5; color: #065F46; }
    .status-preparing { background: #FEF3C7; color: #92400E; }

    .search-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .search-form input, .search-form select {
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      outline: none;
      background: var(--surface);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 600px;
      padding: 1.8rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
      animation: modalPop 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal h3 { margin-bottom: 1.5rem; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
    .form-grid { display: flex; flex-direction: column; gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .input-group label { font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); }
    .input-group input, .input-group select {
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 1rem;
      outline: none;
      background: var(--surface);
    }
    .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: flex-end; }

    @media (max-width: 768px) {
      td, th { padding: 0.6rem; font-size: 0.85rem; }
      .btn-icon { padding: 0.2rem; }
      .card-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
      .btn-action { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="admin-wrapper">
  <div class="admin-header">
    <h1>DASH <span>SOKOON</span> ADMIN</h1>
    <div class="header-btns">
      <button class="btn btn-outline btn-sm" onclick="openDoctorSearchModal()">
        <i class="fas fa-stethoscope"></i> بحث عن دكتور
      </button>
      <button class="btn btn-outline btn-sm" onclick="openStaffListModal()">
        <i class="fas fa-user-shield"></i> الموظفين
      </button>
    </div>
  </div>

  <!-- بطاقة البحث عن طالب -->
  <div class="card">
    <div class="card-title"><i class="fas fa-search"></i> بحث عن طالب</div>
    <div class="search-form">
      <input type="text" id="searchName" placeholder="اسم الطالب">
      <input type="text" id="searchCollege" placeholder="الكلية">
      <input type="text" id="searchDept" placeholder="القسم">
      <select id="searchGrade">
        <option value="">كل الفرق</option>
        <option value="الأولى">الأولى</option>
        <option value="الثانية">الثانية</option>
        <option value="الثالثة">الثالثة</option>
        <option value="الرابعة">الرابعة</option>
      </select>
      <button class="btn btn-primary" onclick="searchStudent()">
        <i class="fas fa-search"></i> بحث
      </button>
    </div>
    <div class="table-wrapper" id="searchResults" style="display: none;"></div>
  </div>

  <!-- صفحة إدارة الكتب -->
  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="fas fa-book-open"></i> إدارة الكتب</div>
      <button class="btn btn-action" onclick="openBookModal()"><i class="fas fa-plus"></i> إضافة كتاب</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>الدكتور</th>
            <th>المادة</th>
            <th>الكلية/القسم</th>
            <th>الفرقة</th>
            <th>السعر</th>
            <th>الحالة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="booksTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- مودال قائمة الموظفين -->
<div class="modal-overlay" id="staffListModal">
  <div class="modal">
    <h3><i class="fas fa-users"></i> إدارة الموظفين</h3>
    <div class="table-wrapper" style="margin-bottom: 1rem;">
      <table>
        <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>كلمة المرور</th><th>إجراءات</th></tr></thead>
        <tbody id="staffListTableBody"></tbody>
      </table>
    </div>
    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
      <button class="btn btn-outline" onclick="closeModal('staffListModal')">إغلاق</button>
      <button class="btn btn-action" onclick="openStaffModal()"><i class="fas fa-plus"></i> إضافة موظف</button>
    </div>
  </div>
</div>

<!-- مودال إضافة/تعديل موظف -->
<div class="modal-overlay" id="staffModal">
  <div class="modal">
    <h3 id="staffModalTitle"><i class="fas fa-user-plus"></i> إضافة موظف جديد</h3>
    <div class="form-grid">
      <input type="hidden" id="staffEditId">
      <div class="input-group"><label>الاسم</label><input type="text" id="staffName" placeholder="الاسم ثلاثي"></div>
      <div class="input-group"><label>اسم المستخدم</label><input type="text" id="staffUser" placeholder="اسم الدخول"></div>
      <div class="input-group"><label>كلمة المرور</label><input type="password" id="staffPass" placeholder="******"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('staffModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveStaff()">حفظ</button>
    </div>
  </div>
</div>

<!-- مودال إضافة/تعديل كتاب -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <h3 id="bookModalTitle"><i class="fas fa-plus-circle"></i> إضافة كتاب جديد</h3>
    <div class="form-grid">
      <input type="hidden" id="bookEditId">
      <div class="input-group"><label>الدكتور</label><input type="text" id="docName" placeholder="د. أحمد فوزي"></div>
      <div class="input-group"><label>المادة</label><input type="text" id="bookTitle" placeholder="محاسبة مالية"></div>
      <div class="input-group">
        <label>الكلية (اختر أو اكتب)</label>
        <input list="colleges-list" id="collegeInput" placeholder="اختر الكلية">
        <datalist id="colleges-list"></datalist>
      </div>
      <div class="input-group">
        <label>القسم (اختر أو اكتب)</label>
        <input list="depts-list" id="deptInput" placeholder="اختر القسم">
        <datalist id="depts-list"></datalist>
      </div>
      <div class="input-group">
        <label>الفرقة الدراسية</label>
        <select id="gradeSelect">
          <option value="">-- اختر الفرقة --</option>
          <option value="الأولى">الأولى</option>
          <option value="الثانية">الثانية</option>
          <option value="الثالثة">الثالثة</option>
          <option value="الرابعة">الرابعة</option>
        </select>
      </div>
      <div class="input-group">
        <label>السعر</label>
        <input type="number" id="bookPrice" placeholder="0.00">
      </div>
      <div class="input-group">
        <label>حالة الكتاب</label>
        <select id="statusSelect">
          <option value="تم الإعلان">📢 تم الإعلان</option>
          <option value="تم النشر">✅ تم النشر</option>
          <option value="قيد التجهيز">⏳ قيد التجهيز</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('bookModal')">إلغاء</button>
      <button class="btn btn-primary" onclick="saveBook()">حفظ</button>
    </div>
  </div>
</div>

<!-- مودال البحث عن دكتور -->
<div class="modal-overlay" id="doctorSearchModal">
  <div class="modal">
    <h3><i class="fas fa-stethoscope"></i> بحث عن دكتور</h3>
    <div class="input-group" style="margin-bottom: 1rem;">
      <label>اسم الدكتور</label>
      <input type="text" id="doctorSearchInput" placeholder="اكتب اسم الدكتور كامل أو جزء منه">
    </div>
    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
      <button class="btn btn-primary" onclick="searchDoctor()"><i class="fas fa-search"></i> بحث</button>
      <button class="btn btn-outline" onclick="closeModal('doctorSearchModal')">إغلاق</button>
    </div>
    <div id="doctorSearchResults">
      <!-- النتائج تظهر هنا -->
    </div>
  </div>
</div>

<script>
  // البيانات
  let staffList = JSON.parse(localStorage.getItem('sokoon_staff')) || [];
  let booksList = JSON.parse(localStorage.getItem('sokoon_books')) || [];
  let dynamicData = JSON.parse(localStorage.getItem('sokoon_config')) || {
    colleges: ['هندسة', 'تجارة', 'حاسبات'],
    depts: ['عام', 'كهرباء', 'محاسبة', 'مدني']
  };
  const RESERVATIONS_KEY = 'dash_sokoon_v3';

  function updateDatalists() {
    const cList = document.getElementById('colleges-list');
    const dList = document.getElementById('depts-list');
    if (cList) cList.innerHTML = dynamicData.colleges.map(c => `<option value="${c}">`).join('');
    if (dList) dList.innerHTML = dynamicData.depts.map(d => `<option value="${d}">`).join('');
  }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.remove('active');
  }

  // ---------- البحث عن دكتور ----------
  function openDoctorSearchModal() {
    document.getElementById('doctorSearchInput').value = '';
    document.getElementById('doctorSearchResults').innerHTML = '';
    document.getElementById('doctorSearchModal').classList.add('active');
  }

  function searchDoctor() {
    const searchTerm = document.getElementById('doctorSearchInput').value.trim().toLowerCase();
    const resultsDiv = document.getElementById('doctorSearchResults');
    if (!searchTerm) {
      resultsDiv.innerHTML = '<p style="text-align:center">الرجاء كتابة اسم الدكتور</p>';
      return;
    }

    const reservations = JSON.parse(localStorage.getItem(RESERVATIONS_KEY)) || [];
    const filtered = reservations.filter(r => r.doctor.toLowerCase().includes(searchTerm));

    if (filtered.length === 0) {
      resultsDiv.innerHTML = '<p style="text-align:center">لا توجد حجوزات لهذا الدكتور</p>';
      return;
    }

    // تجميع حسب الطالب (نفس الـ phone)
    const studentsMap = {};
    filtered.forEach(r => {
      const key = r.phone;
      if (!studentsMap[key]) {
        studentsMap[key] = {
          name: r.studentName,
          phone: r.phone,
          books: [],
          totalForStudent: 0
        };
      }
      studentsMap[key].books.push(r);
      studentsMap[key].totalForStudent += r.price;
    });

    let totalRevenue = 0;
    const students = Object.values(studentsMap);
    students.forEach(s => totalRevenue += s.totalForStudent);

    let html = `<div class="table-wrapper"><table>
      <thead><tr><th>الطالب</th><th>الهاتف</th><th>الكتب المحجوزة</th><th>المبلغ (ج)</th></tr></thead>
      <tbody>`;
    students.forEach(s => {
      const booksList = s.books.map(b => `${b.book} (${b.price} ج)`).join('، ');
      html += `<tr>
        <td>${s.name}</td>
        <td>${s.phone}</td>
        <td>${booksList}</td>
        <td class="price-tag">${s.totalForStudent} ج</td>
      </tr>`;
    });
    html += `</tbody></table></div>
      <div style="text-align:left; margin-top:1rem; font-weight:800; font-size:1.2rem; color:var(--primary);">
        الإجمالي الكلي: ${totalRevenue} ج
      </div>`;
    resultsDiv.innerHTML = html;
  }

  // ---------- البحث عن طالب ----------
  function searchStudent() {
    const name = document.getElementById('searchName').value.trim().toLowerCase();
    const college = document.getElementById('searchCollege').value.trim().toLowerCase();
    const dept = document.getElementById('searchDept').value.trim().toLowerCase();
    const grade = document.getElementById('searchGrade').value;

    const reservations = JSON.parse(localStorage.getItem(RESERVATIONS_KEY)) || [];
    const resultsContainer = document.getElementById('searchResults');
    resultsContainer.innerHTML = '';
    resultsContainer.style.display = 'none';

    if (!name && !college && !dept && !grade) {
      resultsContainer.style.display = 'block';
      resultsContainer.innerHTML = '<p style="text-align:center; padding:1rem;">الرجاء إدخال معيار واحد على الأقل</p>';
      return;
    }

    const filtered = reservations.filter(r => {
      const matchName = !name || r.studentName.toLowerCase().includes(name);
      const matchCollege = !college || r.college.toLowerCase().includes(college);
      const matchDept = !dept || (r.department || '').toLowerCase().includes(dept);
      const matchGrade = !grade || r.grade === grade;
      return matchName && matchCollege && matchDept && matchGrade;
    });

    if (filtered.length === 0) {
      resultsContainer.style.display = 'block';
      resultsContainer.innerHTML = '<p style="text-align:center; padding:1rem;">لا توجد نتائج</p>';
      return;
    }

    const grouped = {};
    filtered.forEach(r => {
      const key = r.phone;
      if (!grouped[key]) {
        grouped[key] = {
          name: r.studentName,
          phone: r.phone,
          college: r.college,
          department: r.department,
          grade: r.grade,
          books: []
        };
      }
      grouped[key].books.push(r);
    });

    let html = '';
    Object.values(grouped).forEach(student => {
      html += `
        <div style="margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem;">
          <strong>${student.name}</strong> - ${student.phone}<br>
          <small>${student.college} | ${student.department} | ${student.grade}</small>
          <table style="width:100%; margin-top:0.5rem;">
            <thead><tr><th>الكتاب</th><th>الدكتور</th><th>السعر</th><th>الحالة</th></tr></thead>
            <tbody>
              ${student.books.map(b => `
                <tr>
                  <td>${b.book}</td>
                  <td>${b.doctor}</td>
                  <td>${b.price} ج</td>
                  <td><span class="status-badge ${b.received ? 'status-published' : 'status-preparing'}">${b.received ? '✅ تم' : '⏳ انتظار'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    });
    resultsContainer.style.display = 'block';
    resultsContainer.innerHTML = html;
  }

  // ---------- الموظفين ----------
  function renderStaffList() {
    const tbody = document.getElementById('staffListTableBody');
    if (!tbody) return;
    tbody.innerHTML = staffList.map(s => `
      <tr>
        <td>${s.name}</td>
        <td>${s.username}</td>
        <td>••••••</td>
        <td class="actions">
          <button class="btn-icon edit" onclick="editStaff(${s.id})"><i class="fas fa-edit"></i></button>
          <button class="btn-icon delete" onclick="deleteStaff(${s.id})"><i class="fas fa-trash"></i></button>
        </td>
      </tr>
    `).join('');
  }

  function openStaffListModal() {
    renderStaffList();
    document.getElementById('staffListModal').classList.add('active');
  }

  function openStaffModal(id = null) {
    document.getElementById('staffEditId').value = '';
    document.getElementById('staffName').value = '';
    document.getElementById('staffUser').value = '';
    document.getElementById('staffPass').value = '';
    document.getElementById('staffModalTitle').innerHTML = '<i class="fas fa-user-plus"></i> إضافة موظف جديد';
    if (id) {
      const s = staffList.find(x => x.id === id);
      if (s) {
        document.getElementById('staffEditId').value = s.id;
        document.getElementById('staffName').value = s.name;
        document.getElementById('staffUser').value = s.username;
        document.getElementById('staffPass').value = s.password;
        document.getElementById('staffModalTitle').innerHTML = '<i class="fas fa-user-edit"></i> تعديل بيانات الموظف';
      }
    }
    document.getElementById('staffModal').classList.add('active');
  }

  function saveStaff() {
    const id = document.getElementById('staffEditId').value;
    const name = document.getElementById('staffName').value.trim();
    const username = document.getElementById('staffUser').value.trim();
    const password = document.getElementById('staffPass').value.trim();
    if (!name || !username || !password) return alert('الرجاء ملء جميع الحقول');

    if (id) {
      const index = staffList.findIndex(s => s.id == id);
      if (index !== -1) staffList[index] = { ...staffList[index], name, username, password };
    } else {
      staffList.push({ id: Date.now(), name, username, password });
    }
    localStorage.setItem('sokoon_staff', JSON.stringify(staffList));
    closeModal('staffModal');
    renderStaffList();
  }

  function editStaff(id) { openStaffModal(id); }

  function deleteStaff(id) {
    if (confirm('حذف هذا الموظف؟')) {
      staffList = staffList.filter(s => s.id !== id);
      localStorage.setItem('sokoon_staff', JSON.stringify(staffList));
      renderStaffList();
    }
  }

  // ---------- الكتب ----------
  function renderBooks() {
    const tbody = document.getElementById('booksTableBody');
    tbody.innerHTML = booksList.map(b => `
      <tr>
        <td>${b.doc}</td>
        <td>${b.title}</td>
        <td>${b.college} - ${b.dept}</td>
        <td>${b.grade || '—'}</td>
        <td class="price-tag">${b.price} ج</td>
        <td><span class="status-badge ${getStatusClass(b.status)}">${b.status || '—'}</span></td>
        <td class="actions">
          <button class="btn-icon edit" onclick="editBook(${b.id})"><i class="fas fa-edit"></i></button>
          <button class="btn-icon delete" onclick="deleteBook(${b.id})"><i class="fas fa-trash"></i></button>
        </td>
      </tr>
    `).join('');
  }

  function getStatusClass(status) {
    if (status === 'تم الإعلان') return 'status-announced';
    if (status === 'تم النشر') return 'status-published';
    if (status === 'قيد التجهيز') return 'status-preparing';
    return '';
  }

  function openBookModal(id = null) {
    updateDatalists();
    document.getElementById('bookEditId').value = '';
    document.getElementById('docName').value = '';
    document.getElementById('bookTitle').value = '';
    document.getElementById('collegeInput').value = '';
    document.getElementById('deptInput').value = '';
    document.getElementById('gradeSelect').value = '';
    document.getElementById('bookPrice').value = '';
    document.getElementById('statusSelect').value = 'تم الإعلان';
    document.getElementById('bookModalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> إضافة كتاب جديد';
    if (id) {
      const b = booksList.find(x => x.id === id);
      if (b) {
        document.getElementById('bookEditId').value = b.id;
        document.getElementById('docName').value = b.doc;
        document.getElementById('bookTitle').value = b.title;
        document.getElementById('collegeInput').value = b.college;
        document.getElementById('deptInput').value = b.dept;
        document.getElementById('gradeSelect').value = b.grade || '';
        document.getElementById('bookPrice').value = b.price;
        document.getElementById('statusSelect').value = b.status || 'تم الإعلان';
        document.getElementById('bookModalTitle').innerHTML = '<i class="fas fa-edit"></i> تعديل بيانات الكتاب';
      }
    }
    document.getElementById('bookModal').classList.add('active');
  }

  function saveBook() {
    const id = document.getElementById('bookEditId').value;
    const doc = document.getElementById('docName').value.trim();
    const title = document.getElementById('bookTitle').value.trim();
    const college = document.getElementById('collegeInput').value.trim();
    const dept = document.getElementById('deptInput').value.trim();
    const grade = document.getElementById('gradeSelect').value;
    const price = document.getElementById('bookPrice').value.trim();
    const status = document.getElementById('statusSelect').value;
    if (!doc || !title || !college || !price) return alert('الرجاء ملء الحقول المطلوبة');
    if (!grade) return alert('الرجاء اختيار الفرقة الدراسية');
    if (college && !dynamicData.colleges.includes(college)) dynamicData.colleges.push(college);
    if (dept && !dynamicData.depts.includes(dept)) dynamicData.depts.push(dept);
    localStorage.setItem('sokoon_config', JSON.stringify(dynamicData));
    const bookData = { doc, title, college, dept, grade, price: Number(price), status };
    if (id) {
      const index = booksList.findIndex(b => b.id == id);
      if (index !== -1) booksList[index] = { ...booksList[index], ...bookData };
    } else {
      booksList.push({ id: Date.now(), ...bookData });
    }
    localStorage.setItem('sokoon_books', JSON.stringify(booksList));
    closeModal('bookModal');
    renderBooks();
  }

  function editBook(id) { openBookModal(id); }

  function deleteBook(id) {
    if (confirm('حذف الكتاب نهائياً؟')) {
      booksList = booksList.filter(b => b.id !== id);
      localStorage.setItem('sokoon_books', JSON.stringify(booksList));
      renderBooks();
    }
  }

  // بدء التشغيل
  renderBooks();
  updateDatalists();
</script>
</body>
</html>
